name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  gates:
    name: Canonical CI gates (tools/ci_gates.sh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Native sqlite3 is required for Drift (NativeDatabase) tests on the host VM.
      - name: Install sqlite3 native lib
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev sqlite3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate platform folders (non-destructive)
        working-directory: app
        run: flutter create .

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      # Regenerate the GITIGNORED drift/freezed/json code so the gate's flutter suite
      # compiles (these files are not committed; l10n freshness is checked in the gate).
      - name: Run build_runner
        working-directory: app
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      # Phase-7 B1 — the SAME canonical gate developers run locally is the ONLY
      # repository-wide validation step (analyze, full Flutter suite, deno tests +
      # lint, node contract tests, skip/ignore manifest, admin auth, migration lint,
      # l10n freshness). No CI-only subset that omits or adds a mandatory step.
      - name: Run canonical CI gates
        run: bash tools/ci_gates.sh
