name: money_companion
description: "تطبيق عربي لتتبع المصاريف تلقائياً من رسائل البنك — Arabic-first, on-device."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.0
  # Fonts & Icons (Design System)
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  # i18n
  intl: 0.20.2
  drift: ^2.18.0
  flutter_secure_storage: ^9.2.2
  path: ^1.9.1
  path_provider: ^2.1.4
  flutter_local_notifications: ^22.0.0
  another_telephony: ^0.4.1
  timezone: ^0.11.0
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.17
  supabase_flutter: ^2.8.3
  cryptography: ^2.7.0
  google_sign_in: ^6.2.2
  # another_telephony: ^0.4.0
  sign_in_with_apple: ^6.1.0
  # dio: ^5.5.0
  # flutter_local_notifications: ^17.2.0
  # timezone: ^0.9.4
  # rive: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1
  # ── codegen (يُفعّل عند تحويل الموديلات إلى freezed) ──
  build_verify: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/logo_light.png
    - assets/logo/logo_dark.png
    - assets/brand/branding_light_1024.png
    - assets/brand/branding_dark_1024.png
    - assets/brand/symbol_green_light.png
    - assets/brand/symbol_green_dark.png
    - assets/flags/
    - assets/brands/

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

  # json_serializable: ^6.8.0
  # mocktail: ^1.0.0
