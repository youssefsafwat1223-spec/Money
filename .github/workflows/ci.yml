name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  flutter:
    name: Analyze & Test (app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # مكتبة sqlite3 الأصلية مطلوبة لاختبارات Drift (NativeDatabase) على VM المضيف.
      - name: Install sqlite3 native lib
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev sqlite3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders (non-destructive)
        run: flutter create .

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
