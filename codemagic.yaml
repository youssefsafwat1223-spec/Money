# Codemagic CI/CD — Mali (money_companion)
#
# The Flutter project lives in ./app, so every app workflow sets
# `working_directory: app`. Four workflows are provided:
#
#   1. ios-unsigned-sideload  -> builds an UNSIGNED .ipa for Sideloadly / iLoader.
#                                No Apple Developer account needed at build time;
#                                Sideloadly re-signs with your free Apple ID.
#   2. ios-signed-release     -> builds a SIGNED .ipa via Codemagic code signing
#                                (needs an Apple Developer Program account).
#   3. android-release        -> builds a release .aab; mirrors the production
#                                config assertions (MALI-036).
#   4. backend-and-quality-gates -> SQL/migration lint, Edge-function Deno tests,
#                                admin panel lint/build, flutter analyze/test —
#                                the backend/SQL/RLS/Edge/admin gates the CI was
#                                missing (MALI-036). No device build.
#
# Supabase: SUPABASE_URL, SUPABASE_ANON_KEY, and SUPABASE_ENV are injected as --dart-define.
# These are PRODUCTION workflows: both assert the Supabase values are non-empty
# before building, and the app itself fails closed at startup in release mode
# if they are missing (bootstrap_runner._assertRuntimeConfig) — release builds
# must never fall back to stub auth. Staging must use a separate workflow and
# pass --dart-define=SUPABASE_ENV=staging explicitly.

workflows:
  # ---------------------------------------------------------------------------
  # 1) UNSIGNED IPA for sideloading (Sideloadly / iLoader). Recommended default.
  # ---------------------------------------------------------------------------
  ios-unsigned-sideload:
    name: iOS Unsigned IPA (Sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - supabase
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.youssefsafwat.mali"
        # One explicit output path is used for stamping, verification, artifact
        # collection, and email publication. It is never wildcard-selected.
        IOS_UNSIGNED_IPA: "app/money_companion-unsigned.ipa"
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      - name: Regenerate localizations
        working_directory: app
        script: flutter gen-l10n

      # Audit H-15: even the unsigned sideload IPA is a production-configured,
      # distributable RELEASE artifact, so it runs the same canonical gate before
      # the build — a mandatory-gate failure makes the build and packaging below
      # unreachable.
      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before build
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Assert production Supabase config
        script: |
          set -e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi

      - name: Build unsigned iOS (.app)
        working_directory: app
        script: |
          # SUPABASE_* come from the "supabase" group; asserted non-empty above.
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)"

      - name: Package .app into unsigned .ipa
        working_directory: app
        script: |
          set -eu
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH" && exit 1
          fi
          IPA="$CM_BUILD_DIR/$IOS_UNSIGNED_IPA"
          rm -rf Payload
          rm -f "$IPA" "$IPA.provenance"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q "$IPA" Payload
          rm -rf Payload
          echo "Built the single explicit unsigned artifact: $IPA"

      # Provenance is produced after final packaging and before verification. It
      # remains external, and its SHA-256 binds the exact immutable IPA bytes.
      - name: Stamp and verify the EXACT packaged IPA — REQUIRED before email
        working_directory: app
        script: |
          set -eu
          IPA="$CM_BUILD_DIR/$IOS_UNSIGNED_IPA"
          bash ../tools/stamp_ios_provenance.sh "$IPA"
          bash ../tools/verify_ios_release_artifact.sh "$IPA"
    artifacts:
      - $IOS_UNSIGNED_IPA
      - ${IOS_UNSIGNED_IPA}.provenance
      - app/build/ios/iphoneos/Runner.app
      - app/build/**/outputs/**/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - youssefsafwat1278@gmail.com   # change as needed
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 2) SIGNED IPA via Codemagic code signing (needs Apple Developer Program).
  # ---------------------------------------------------------------------------
  ios-signed-release:
    name: iOS Signed IPA (Ad Hoc / App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic_asc_api_key   # name of the ASC API key in Codemagic
    environment:
      groups:
        - supabase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.youssefsafwat.mali
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      vars:
        # Candidate discovery must yield exactly one IPA. It is then renamed
        # without changing bytes to this single publication path.
        IOS_RELEASE_IPA: "app/build/ios/ipa/money_companion-signed.ipa"
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      # Audit H-15: the canonical gate runs BEFORE any signing material is set up
      # or any artifact is built, so a mandatory-gate failure structurally makes
      # provisioning, the signed build, and the TestFlight submission below
      # unreachable (Codemagic aborts the workflow on a non-zero step). Same
      # authority (tools/ci_gates.sh) as GitHub + the quality workflow; strict so
      # a missing tool cannot hollow-pass a release gate.
      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before signing
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Set up provisioning profiles
        script: |
          xcode-project use-profiles

      - name: Assert production Supabase config
        script: |
          set -e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi

      - name: Materialise AdMob release config (native)
        working_directory: app
        script: |
          # The iOS App ID must reach Info.plist via a build setting; dart-define
          # alone cannot. Release.xcconfig has an optional `#include? AdMob.xcconfig`,
          # so writing this file supplies ADMOB_APP_ID_IOS to the native build.
          # The file is gitignored and is never committed. If the variable is
          # unset we write nothing: the build then ships with an empty app id and
          # Dart holds ads closed.
          if [ -n "${ADMOB_APP_ID_IOS:-}" ]; then
            printf 'ADMOB_APP_ID_IOS=%s\n' "$ADMOB_APP_ID_IOS" > ios/Flutter/AdMob.xcconfig
            echo "AdMob iOS app id supplied to the native build (value not printed)."
          else
            rm -f ios/Flutter/AdMob.xcconfig
            echo "No ADMOB_APP_ID_IOS provided — building with ads unconfigured (fail closed)."
          fi

      - name: Build signed IPA
        working_directory: app
        script: |
          set -eu
          # AdMob (R7 I3): release inputs are environment-provided, never
          # committed. The App ID must reach BOTH Dart (which decides ad
          # eligibility) and the native Info.plist (which the SDK reads) — the
          # latter via the AdMob.xcconfig step above. Absent values are legal:
          # the build then has NO ad configuration and report export simply
          # runs without ads.
          # Remove only the prior export directory before codesign/export so a
          # stale single IPA cannot masquerade as output from this build.
          rm -rf build/ios/ipa
          flutter build ipa --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)" \
            --dart-define=ADMOB_APP_ID_IOS="${ADMOB_APP_ID_IOS:-}" \
            --dart-define=ADMOB_INTERSTITIAL_IOS="${ADMOB_INTERSTITIAL_IOS:-}" \
            --dart-define=ADMOB_BANNER_IOS="${ADMOB_BANNER_IOS:-}" \
            --export-options-plist=/Users/builder/export_options.plist

      # Resolve the export exactly once. Zero or multiple candidates fail before
      # provenance or publishing. A metadata-only rename gives Codemagic one
      # explicit path; hashes prove the signed bytes survive it unchanged.
      # Provenance is then produced at build time, before a verifier requires it.
      - name: Resolve, stamp, and verify the EXACT signed IPA — REQUIRED before submit
        working_directory: app
        script: |
          set -eu
          IPA_DIR="$CM_BUILD_DIR/app/build/ios/ipa"
          CANDIDATE="$(bash ../tools/verify_ios_release_artifact.sh --resolve-only "$IPA_DIR")"
          PUBLISH_DIR="$(cd "$(dirname "$CM_BUILD_DIR/$IOS_RELEASE_IPA")" && pwd -P)"
          IPA="$PUBLISH_DIR/$(basename "$IOS_RELEASE_IPA")"
          SHA_BEFORE_MOVE="$(shasum -a 256 "$CANDIDATE" | awk '{print $1}')"
          if [ "$CANDIDATE" != "$IPA" ]; then
            [ ! -e "$IPA" ] || { echo "ERROR: canonical IPA path already exists: $IPA"; exit 1; }
            mv "$CANDIDATE" "$IPA"
          fi
          SHA_AFTER_MOVE="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          [ "$SHA_AFTER_MOVE" = "$SHA_BEFORE_MOVE" ] || {
            echo "ERROR: signed IPA bytes changed while assigning the publication path."
            exit 1
          }
          bash ../tools/stamp_ios_provenance.sh "$IPA"
          bash ../tools/verify_ios_release_artifact.sh "$IPA"
    artifacts:
      # App Store Connect receives the only collected .ipa: the exact path above.
      - $IOS_RELEASE_IPA
      - ${IOS_RELEASE_IPA}.provenance
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - youssefsafwat1278@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 3) ANDROID release App Bundle. Mirrors the iOS production config assertions
  #    so a broken Android/backend combination can't ship green (MALI-036).
  # ---------------------------------------------------------------------------
  android-release:
    name: Android Release (App Bundle)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - supabase
        # Upload-key material + credentials, set in Codemagic (never in source):
        #   ANDROID_KEYSTORE_BASE64    base64 of the UPLOAD keystore (.jks)
        #   ANDROID_KEYSTORE_PASSWORD  store password
        #   ANDROID_KEY_ALIAS          key alias
        #   ANDROID_KEY_PASSWORD       key password
        # ANDROID_KEYSTORE_PATH is NOT stored — it is produced by the
        # materialisation step below and exported for build.gradle.kts.
        - google_play
      flutter: 3.44.2
      vars:
        PACKAGE_NAME: "com.youssefsafwat.mali"
    scripts:
      - name: Flutter pub get
        working_directory: app
        script: flutter pub get

      - name: Regenerate localizations
        working_directory: app
        script: flutter gen-l10n

      # Audit H-15: the canonical gate runs BEFORE the upload key is materialised
      # and BEFORE the release AAB is built, so a mandatory-gate failure makes the
      # keystore, the signed build, the signer inspection, and any Play upload
      # unreachable (Codemagic aborts on a non-zero step). The release AAB build
      # below is itself the mandatory Android *release* compile; the auto-triggered
      # quality workflow independently proves the Android *debug* compile on every
      # push, so no redundant debug build is added here.
      - name: Canonical gates (tools/ci_gates.sh, strict) — REQUIRED before signing
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )
          REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      - name: Assert production Supabase config
        script: |
          set -e
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "ERROR: SUPABASE_URL / SUPABASE_ANON_KEY are empty — a production"
            echo "build must never ship without a real backend (stub-auth risk)."
            exit 1
          fi

      - name: Materialise upload keystore (ephemeral)
        script: |
          set -eu
          # Google Play App Signing model: Play holds the APP SIGNING key; this
          # materialises the UPLOAD key only. The decoded keystore is written to
          # the ephemeral CI workspace (never the repository, never a fixed
          # machine path) and is discarded with the runner.
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: missing Android release signing input(s):$missing"
            echo "A release build must never be signed with the debug key, so this fails here."
            exit 1
          fi
          KEYSTORE_PATH="${CM_BUILD_DIR}/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          # Sanity-check the decode produced a real keystore, without printing it.
          [ -s "$KEYSTORE_PATH" ] || { echo "ERROR: decoded keystore is empty"; exit 1; }
          # Export the path only (no secret values are ever echoed).
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$CM_ENV"
          echo "Upload keystore materialised at the build workspace (path exported; no values printed)."

      - name: Build release App Bundle
        working_directory: app
        script: |
          # AdMob (R7 A3): ADMOB_APP_ID_ANDROID is read from the environment by
          # Gradle for the manifest placeholder, and passed to Dart as well so
          # the eligibility gate agrees with the manifest. Absent ⇒ no ads.
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL:-}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-}" \
            --dart-define=SUPABASE_ENV=production \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=LEGAL_BASE_URL="${LEGAL_BASE_URL:-}" \
            --dart-define=APP_VERSION="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)" \
            --dart-define=ADMOB_APP_ID_ANDROID="${ADMOB_APP_ID_ANDROID:-}" \
            --dart-define=ADMOB_INTERSTITIAL_ANDROID="${ADMOB_INTERSTITIAL_ANDROID:-}" \
            --dart-define=ADMOB_BANNER_ANDROID="${ADMOB_BANNER_ANDROID:-}"

      # §13 — never ship an artifact whose signer was not checked. Cheap, and it
      # would catch a debug-signed or unsigned bundle before it reaches Play.
      - name: Inspect release artifact signer
        working_directory: app
        script: |
          set -eu
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -f "$AAB" || { echo "ERROR: no AAB produced"; exit 1; }
          SIGNER="$(jarsigner -verify -verbose:summary -certs "$AAB" | grep -m1 'X.509' || true)"
          echo "Signer: ${SIGNER:-<none>}"
          jarsigner -verify "$AAB" >/dev/null || { echo "ERROR: AAB is not signed"; exit 1; }
          # A debug-signed upload is rejected by Play and must never get that far.
          if printf '%s' "$SIGNER" | grep -q 'Android Debug'; then
            echo "ERROR: artifact is signed with the Android DEBUG certificate"
            exit 1
          fi
          echo "Release artifact signature verified (not debug-signed)."

      - name: Shred materialised keystore
        script: |
          set -eu
          # Belt-and-braces: the runner is ephemeral, but never leave key
          # material lying around for later steps or cached workspaces.
          rm -f "${CM_BUILD_DIR}/upload-keystore.jks" || true
          echo "Materialised keystore removed."
    artifacts:
      - app/build/**/outputs/bundle/**/*.aab
      - app/build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - youssefsafwat1278@gmail.com
        notify:
          success: true
          failure: true

  # ---------------------------------------------------------------------------
  # 4) BACKEND + QUALITY GATES (no device build). Closes the CI gaps flagged by
  #    MALI-036: SQL/migration safety, Edge-function tests, and admin panel.
  # ---------------------------------------------------------------------------
  backend-and-quality-gates:
    name: Backend & Quality Gates
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Audit H-16: this workflow (which holds the ONLY Android compile coverage)
    # must run AUTOMATICALLY on the pre-release development path — never behind a
    # human pressing "Run". It stays quality-only: no signing key, no production
    # AdMob, no store upload, so it is safe to trigger on push/PR. Pure-docs
    # changes are excluded so an Android build is not spent on a README edit.
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
        - pattern: develop
          include: true
        - pattern: 'feat/*'
          include: true
      cancel_previous_builds: true
      when:
        changeset:
          excludes:
            - 'docs/**'
            - '**/*.md'
    environment:
      flutter: 3.44.2
      # JDK 17 is what the project actually requires (sourceCompatibility /
      # targetCompatibility VERSION_17, jvmTarget JVM_17) and what AGP 9 needs.
      # Pinned so the Android compile gate below reproduces the locally-proven
      # toolchain instead of whatever the image happens to ship.
      java: 17
    scripts:
      # Audit H-15/CI-02 + requirement 4: ONE canonical authority. Instead of a
      # hand-maintained subset of gates, run tools/ci_gates.sh — the same script
      # GitHub Actions runs — so the two paths can never drift. Prereqs (deno,
      # admin deps, flutter packages) are set up first; REQUIRE_ALL_GATES=1 makes
      # a tool-missing stage FATAL, so this can never hollow-pass.
      - name: Canonical gates (tools/ci_gates.sh, strict)
        script: |
          set -eu
          if ! command -v deno >/dev/null 2>&1; then
            curl -fsSL https://deno.land/install.sh | sh
            export PATH="$HOME/.deno/bin:$PATH"
          fi
          ( cd admin && npm ci )      # ci_gates runs the admin authorization suite
          ( cd app && flutter pub get )
          REQUIRE_ALL_GATES=1 bash tools/ci_gates.sh

      # ── Android compile gate (R8C) ─────────────────────────────────────────
      # Android compilation used to happen ONLY in `android-release`: on release
      # day, behind the real signing inputs. So a plugin/Gradle defect stayed
      # invisible until the worst possible moment — which is exactly how the
      # file_picker x AGP-9 failure survived:
      #     GeneratedPluginRegistrant: cannot find symbol FilePickerPlugin
      # A debug APK is the cheapest artifact that still exercises the whole
      # meaningful chain: Gradle 9.1.0, AGP 9.0.1, Kotlin 2.3.20, javac,
      # GeneratedPluginRegistrant, native plugins, sqlite3mc via the NDK and
      # manifest merge. It needs NO signing key, NO production AdMob ids and NO
      # backend. The real signed AAB stays in `android-release`.
      - name: Android compile gate (debug APK - no signing, no prod config)
        working_directory: app
        script: |
          set -eu

          # The vendored file_picker fork carries the AGP-9 registration fix. If
          # resolution ever silently falls back to pub.dev the patch is gone and
          # this gate is worthless, so fail loudly rather than build the wrong
          # dependency.
          grep -q 'path: ../third_party/file_picker' pubspec.yaml || {
            echo "ERROR: file_picker is not wired to the vendored fork."
            echo "See third_party/file_picker/QIRSH_FORK.md."
            exit 1
          }

          # NDK is required because the encrypted SQLite backend (sqlite3mc) is
          # built as a native asset. Install the pinned version if the image does
          # not already carry it.
          NDK_VERSION="28.2.13676358"
          if [ ! -d "${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}/ndk/$NDK_VERSION" ]; then
            echo "Installing NDK $NDK_VERSION"
            yes | sdkmanager --install "ndk;$NDK_VERSION" >/dev/null
          fi

          flutter build apk --debug

          # Prove the artifact exists rather than trusting the exit code alone.
          test -f build/app/outputs/flutter-apk/app-debug.apk \
            || { echo "ERROR: debug APK missing after a 'successful' build"; exit 1; }
          echo "Android compile gate passed (debug APK produced)."
    publishing:
      email:
        recipients:
          - youssefsafwat1278@gmail.com
        notify:
          success: true
          failure: true
