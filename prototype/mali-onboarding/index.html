<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مالي — تصاميم الـ Onboarding (Navy + Amber)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0A2540; --navy2:#173A5E; --amber:#FFB300; --success:#16A968;
    --bg:#F0F4F8; --surface:#FFFFFF; --surface2:#E6ECF3;
    --text:#0A2540; --text-light:#5C6B7C; --border:#D7E0EA; --danger:#E5484D;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"Alexandria",sans-serif;background:#dce4ec;color:var(--text);padding:44px 24px 80px;}
  .head{max-width:1280px;margin:0 auto 36px;}
  .head h1{font-size:24px;font-weight:800;color:var(--navy)}
  .head p{font-size:13.5px;color:var(--text-light);margin-top:8px;line-height:1.6}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:12px;font-weight:600;background:#fff;border:1px solid var(--border);padding:6px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px}
  .sw{width:13px;height:13px;border-radius:4px}
  .grid{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:46px 28px;justify-items:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:14px}
  .cap{font-size:12.5px;color:#5a6b7d;font-weight:600}

  .phone{width:300px;height:640px;border-radius:46px;background:#0a1622;padding:6px;box-shadow:0 30px 60px -20px rgba(10,37,64,.4);position:relative;flex:none}
  .phone::after{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:96px;height:24px;background:#0a1622;border-radius:999px;z-index:30}
  .scr{position:absolute;inset:6px;border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
  .sb{height:46px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;padding:6px 22px 0;flex:none;color:var(--navy)}
  .body{flex:1;display:flex;flex-direction:column;padding:0 22px;min-height:0}
  .grow{flex:1;display:flex;flex-direction:column;justify-content:center}
  .skip{text-align:start;font-size:13px;font-weight:600;color:var(--text-light);padding:6px 2px}

  /* hero navy panel */
  .hero{height:240px;border-radius:28px;background:linear-gradient(150deg,var(--navy),var(--navy2));
    display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 18px 40px -14px rgba(10,37,64,.45)}
  .hero::before{content:"";position:absolute;top:-50px;width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,179,0,.28),transparent 70%)}
  .hero .disc{width:108px;height:108px;border-radius:50%;background:rgba(255,179,0,.16);
    border:1.5px solid rgba(255,179,0,.5);display:grid;place-items:center;position:relative;z-index:2}
  .hero .disc svg{width:50px;height:50px;stroke:var(--amber);fill:none;stroke-width:1.8}

  .kicker{font-size:13px;font-weight:700;color:var(--amber);text-align:center;margin-top:22px}
  .title{font-size:25px;font-weight:800;color:var(--navy);text-align:center;line-height:1.3;margin-top:8px}
  .title.start{text-align:start}
  .sub{font-size:14px;color:var(--text-light);text-align:center;line-height:1.6;margin-top:10px}

  /* welcome */
  .logo{width:148px;height:148px;border-radius:36px;object-fit:cover;display:block;margin:0 auto;
    box-shadow:0 0 50px -6px rgba(255,179,0,.4), 0 18px 40px -14px rgba(10,37,64,.3);
    background:linear-gradient(150deg,#fff,#eef2f7)}
  .word{font-size:46px;font-weight:800;color:var(--navy);text-align:center;margin-top:24px}
  .uline{width:44px;height:4px;background:var(--amber);border-radius:999px;margin:10px auto 0}

  /* vault */
  .vault{width:150px;height:150px;position:relative}
  .vault .door{position:absolute;inset:0;border-radius:30px;background:linear-gradient(160deg,#1d3a57,#16314a);
    border:1.5px solid rgba(255,255,255,.12);overflow:hidden}
  .vault .fill{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:0 0 28px 28px;
    background:linear-gradient(180deg,#FFD66B,var(--amber))}
  .vault .dial{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:50%;background:#fff;
    border:3px solid var(--amber);z-index:2}
  .vault .dial::after{content:"";position:absolute;top:9px;left:50%;width:4px;height:16px;background:var(--navy);border-radius:2px;transform:translateX(-50%) rotate(35deg)}

  /* options */
  .opt{display:flex;align-items:center;gap:13px;padding:15px 16px;border-radius:16px;background:var(--surface);
    border:1.5px solid var(--border);margin-top:14px}
  .opt.sel{border-color:var(--navy)}
  .opt .tile{width:40px;height:40px;border-radius:11px;background:rgba(10,37,64,.07);display:grid;place-items:center}
  .opt .tile svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:1.8}
  .opt .tile.amber{background:rgba(255,179,0,.14)} .opt .tile.amber svg{stroke:var(--amber)}
  .opt .nm{font-weight:700;font-size:15px;flex:1}
  .opt .ck{width:24px;height:24px;color:var(--success)}

  /* privacy */
  .shield{width:64px;height:64px;border-radius:16px;background:linear-gradient(150deg,var(--navy),var(--navy2));display:grid;place-items:center}
  .shield svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.8}
  .prow{display:flex;align-items:center;gap:12px;padding:8px 0}
  .prow .c{width:26px;height:26px;border-radius:50%;background:rgba(22,169,104,.14);display:grid;place-items:center}
  .prow .c svg{width:15px;height:15px;stroke:var(--success);fill:none;stroke-width:2.4}
  .prow span{font-size:15px;font-weight:500}

  /* auth */
  .abtn{height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:15px;margin-top:12px;border:1.5px solid transparent}
  .abtn.dark{background:#000;color:#fff}
  .abtn.line{background:var(--surface);color:var(--navy);border-color:var(--border)}
  .abtn svg{width:20px;height:20px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--text-light);font-size:12px;font-weight:600;margin:18px 0}
  .divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--border)}
  .input{height:52px;border-radius:16px;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;padding:0 15px;color:var(--text-light);font-size:14px;font-weight:500;gap:10px;margin-top:8px}
  .label{font-size:12px;font-weight:700;color:var(--text-light)}

  /* dock */
  .dock{padding:16px 0 10px;flex:none}
  .dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
  .dots i{width:7px;height:7px;border-radius:999px;background:var(--border)}
  .dots i.on{width:24px;background:var(--amber)}
  .cta{height:56px;border-radius:16px;background:linear-gradient(150deg,var(--navy),var(--navy2));
    color:#fff;font-weight:800;font-size:16px;display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(10,37,64,.5)}

  /* otp */
  .otp{display:flex;gap:9px;direction:ltr;justify-content:center;margin-top:8px}
  .otp .d{width:40px;height:54px;border-radius:14px;background:var(--surface);border:1.5px solid var(--border);
    display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--navy)}
  .otp .d.f{border-color:var(--navy)}.otp .d.e{color:#cfd8e2}
  .glow-ic{width:72px;height:72px;border-radius:50%;background:rgba(10,37,64,.08);display:grid;place-items:center;margin:0 auto}
  .glow-ic svg{width:34px;height:34px;stroke:var(--navy);fill:none;stroke-width:1.8}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px;margin-top:14px}
  .step{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
  .step .n{width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,var(--navy),var(--navy2));color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;flex:none}
  .step p{font-size:13px;line-height:1.5}
  .ghost{text-align:center;color:var(--text-light);font-weight:600;font-size:13px;padding:12px}
</style>
</head>
<body>
<div class="head">
  <h1>مالي — تصاميم الـ Onboarding</h1>
  <p>الهوية الجديدة: Navy + Amber · RTL · Alexandria · بدون إيموجي. كل الشاشات بالألوان المعتمدة.</p>
  <div class="chips">
    <span class="chip"><span class="sw" style="background:#0A2540"></span> Primary #0A2540</span>
    <span class="chip"><span class="sw" style="background:#FFB300"></span> Accent #FFB300</span>
    <span class="chip"><span class="sw" style="background:#16A968"></span> Success #16A968</span>
    <span class="chip"><span class="sw" style="background:#F0F4F8;border:1px solid #ccc"></span> Bg #F0F4F8</span>
  </div>
</div>

<div class="grid" id="grid"></div>

<script>
const SB = `<div class="sb"><span>9:41</span><span>● ▮ ▰</span></div>`;
const dots = n => `<div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>`;
const cta = (t='التالي') => `<div class="cta">${t}</div>`;

// simple inline SVGs (stroke)
const ic = {
  sms:`<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
  shield:`<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  check:`<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
  flag:`<svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`,
  cash:`<svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/></svg>`,
  apple:`<svg viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M16 1c.1 1-.3 2-1 2.7-.6.7-1.6 1.2-2.5 1.1-.1-1 .4-2 1-2.6.6-.7 1.7-1.2 2.5-1.2zM18.5 17c-.5 1.2-.8 1.7-1.4 2.7-.9 1.4-2.2 3.1-3.8 3.1-1.4 0-1.8-.9-3.7-.9s-2.3.9-3.7.9c-1.6 0-2.8-1.6-3.7-3C-.6 16-.9 11 1.3 8.5 2.4 7.1 4 6.3 5.5 6.3c1.6 0 2.6.9 3.9.9 1.3 0 2-.9 3.9-.9 1.3 0 2.7.7 3.7 2-3.2 1.8-2.7 6.3.6 7.4z"/></svg>`,
  mail:`<svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>`,
};
const google = `<svg viewBox="0 0 24 24" stroke="none"><path fill="#4285F4" d="M22.5 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.9a5 5 0 0 1-2.2 3.3v2.7h3.6c2.1-2 3.2-4.9 3.2-7.9z"/><path fill="#34A853" d="M12 23c2.9 0 5.4-1 7.2-2.6l-3.6-2.7c-1 .7-2.3 1.1-3.6 1.1-2.8 0-5.1-1.9-6-4.4H2.3v2.8A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M6 14.3a6.6 6.6 0 0 1 0-4.2V7.3H2.3a11 11 0 0 0 0 9.8z"/><path fill="#EA4335" d="M12 5.5c1.6 0 3 .5 4.1 1.6l3.1-3.1A11 11 0 0 0 2.3 7.3L6 10.1c.9-2.6 3.2-4.6 6-4.6z"/></svg>`;

const screens = [
/* 1 welcome */
{cap:"١ — الترحيب", html:`${SB}
<div class="body"><div class="grow">
  <img class="logo" src="../../app/assets/logo/logo_light.png" alt="مالي" onerror="this.style.display='none'"/>
  <div class="word">مالي</div><div class="uline"></div>
  <div class="sub" style="margin-top:18px;font-size:17px;font-weight:700;color:var(--navy)">صاحبك في فلوسك</div>
  <div class="sub">اعرف وين راحت فلوسك، ووفّر وكأنها لعبة يومية.</div>
</div>
<div class="dock">${dots(0)}${cta()}</div></div>`},

/* 2 intro */
{cap:"٢ — الحل", html:`${SB}
<div class="skip">تخطّي</div>
<div class="body"><div class="grow">
  <div class="hero"><div class="disc">${ic.sms}</div></div>
  <div class="kicker">بدون مجهود</div>
  <div class="title">لا تكتب —<br>إحنا نفهمها لك</div>
  <div class="sub">نقرأ رسائل بنكك على جهازك، ونطلّع المبلغ والمتجر ونصنّفها تلقائياً.</div>
</div>
<div class="dock">${dots(1)}${cta()}</div></div>`},

/* 3 vault */
{cap:"٣ — التحفيز", html:`${SB}
<div class="skip">تخطّي</div>
<div class="body"><div class="grow">
  <div class="hero"><div class="vault"><div class="door"><div class="fill"></div></div><div class="dial"></div></div></div>
  <div class="kicker">التحفيز</div>
  <div class="title">وفّر وكأنها<br>لعبة يومية</div>
  <div class="sub">حدّد هدفك، وشوف خزنتك تمتلئ مع كل ريال توفّره.</div>
</div>
<div class="dock">${dots(2)}${cta()}</div></div>`},

/* 4 country */
{cap:"٤ — الدولة", html:`${SB}
<div class="skip">تخطّي</div>
<div class="body"><div class="grow">
  <div class="title start">وين مكانك؟</div>
  <div class="sub" style="text-align:start">نضبط العملة والبنوك المدعومة لك.</div>
  <div class="opt sel"><div class="tile">${ic.flag}</div><span class="nm">السعودية</span><span class="ck">${ic.check.replace('stroke-width="1.8"','')}</span></div>
  <div class="opt"><div class="tile amber">${ic.cash}</div><span class="nm" style="font-weight:500">العملة: ريال سعودي (SAR)</span></div>
</div>
<div class="dock">${dots(3)}${cta()}</div></div>`},

/* 5 privacy */
{cap:"٥ — الخصوصية", html:`${SB}
<div class="skip">تخطّي</div>
<div class="body"><div class="grow">
  <div class="shield">${ic.shield}</div>
  <div class="title start" style="margin-top:16px">فلوسك تبقى عندك</div>
  <div style="margin-top:14px">
    <div class="prow"><div class="c">${ic.check}</div><span>كل المعالجة على جهازك</span></div>
    <div class="prow"><div class="c">${ic.check}</div><span>نقرأ فقط رسائل البنوك</span></div>
    <div class="prow"><div class="c">${ic.check}</div><span>ما نبيع بياناتك أبداً</span></div>
    <div class="prow"><div class="c">${ic.check}</div><span>تحذف كل شيء وقت ما تبي</span></div>
  </div>
</div>
<div class="dock">${dots(4)}${cta('يلا نبدأ')}</div></div>`},

/* 6 auth */
{cap:"٦ — الدخول", html:`${SB}
<div class="body" style="padding-top:10px">
  <img class="logo" src="../../app/assets/logo/logo_light.png" style="width:72px;height:72px;border-radius:20px" onerror="this.style.display='none'"/>
  <div class="title" style="margin-top:16px;font-size:22px">سجّل دخولك للبدء</div>
  <div class="sub">الدخول لتحديد هويتك فقط. بياناتك المالية تبقى على جهازك.</div>
  <div style="height:18px"></div>
  <div class="abtn dark">${ic.apple} المتابعة مع Apple</div>
  <div class="abtn line">${google} المتابعة مع Google</div>
  <div class="divider">أو</div>
  <div class="label">المتابعة بالبريد</div>
  <div class="input">${ic.mail} name@example.com</div>
  <div class="cta" style="margin-top:14px;height:52px">إرسال رمز الدخول</div>
</div>`},

/* 7 otp */
{cap:"٧ — رمز التحقق", html:`${SB}
<div class="body" style="padding-top:18px">
  <div class="glow-ic">${ic.mail}</div>
  <div class="title" style="margin-top:18px;font-size:22px">أدخل رمز التحقق</div>
  <div class="sub">أرسلنا كوداً إلى <b style="color:var(--navy)">name@example.com</b></div>
  <div class="otp" style="margin-top:24px"><div class="d f">4</div><div class="d f">9</div><div class="d f">2</div><div class="d e">•</div><div class="d e">•</div><div class="d e">•</div></div>
  <div class="cta" style="margin-top:24px;height:52px">تأكيد الرمز</div>
  <div class="ghost">إعادة الإرسال خلال 0:27</div>
</div>`},

/* 8 method iOS */
{cap:"٨ — الطريقة (iPhone)", html:`${SB}
<div class="body" style="padding-top:14px">
  <div class="glow-ic">${ic.sms}</div>
  <div class="title" style="margin-top:14px;font-size:21px">على iPhone، أنت تتحكّم</div>
  <div class="sub">أضف عملياتك بمشاركة رسالة البنك أو باختصار Siri.</div>
  <div class="card">
    <div class="step"><div class="n">1</div><p>افتح رسالة البنك في تطبيق الرسائل.</p></div>
    <div class="step"><div class="n">2</div><p>اضغط «مشاركة» واختر مالي.</p></div>
    <div class="step"><div class="n">3</div><p>أو أنشئ اختصار Siri يشارك الرسالة.</p></div>
  </div>
  <div class="abtn line" style="height:48px;border-color:var(--navy);color:var(--navy)">دليل إعداد الاختصار خطوة بخطوة</div>
  <div style="flex:1"></div>
  <div class="cta" style="height:52px">تمام، فهمت</div>
  <div class="ghost">لاحقاً، ألصق يدوياً</div>
</div>`},
];

const grid = document.getElementById('grid');
screens.forEach(s=>{
  const c=document.createElement('div');c.className='cell';
  c.innerHTML=`<div class="phone"><div class="scr">${s.html}</div></div><div class="cap">${s.cap}</div>`;
  grid.appendChild(c);
});
</script>
</body>
</html>
