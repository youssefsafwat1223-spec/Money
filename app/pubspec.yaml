name: money_companion
description: "تطبيق عربي لتتبع المصاريف تلقائياً من رسائل البنك — Arabic-first, on-device."
publish_to: "none"
version: 0.1.3+39

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & DI
  flutter_riverpod: ^2.5.1
  # Routing
  go_router: ^14.2.0
  # Icons (Design System). Fonts are BUNDLED (see `flutter: fonts:` below) — the
  # runtime `google_fonts` package was removed in B2-D so the app never fetches
  # typography over the network.
  lucide_icons: ^0.257.0
  # i18n
  intl: 0.20.2
  drift: ^2.18.0
  flutter_secure_storage: ^9.2.2
  path: ^1.9.1
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.17
  supabase_flutter: ^2.8.3
  postgrest: ^2.7.1
  cryptography: ^2.7.0
  crypto: ^3.0.7
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  archive: ^4.0.9
  csv: ^8.0.0
  file_picker: ^11.0.2
  sign_in_with_apple: ^6.1.0
  sentry_flutter: ^9.22.0
  local_auth: ^2.3.0
  http: ^1.2.2
  native_glass_navbar:
    path: packages/native_glass_navbar
  pdf: ^3.12.0
  printing: ^5.14.3
  google_mobile_ads: 9.0.0
  # dio: ^5.5.0
  # flutter_local_notifications: ^17.2.0
  # timezone: ^0.9.4
  # rive: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # لاختبار مسار إجراءات الإشعار الخلفية عبر PathProviderPlatform وهمي.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4
  # ── codegen (يُفعّل عند تحويل الموديلات إلى freezed) ──
  build_verify: ^3.1.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/logo_light.png
    - assets/logo/logo_dark.png
    - assets/brand/branding_light_1024.png
    - assets/brand/branding_dark_1024.png
    - assets/brand/symbol_green_light.png
    - assets/brand/symbol_green_dark.png
    - assets/qirsh/
    - assets/flags/
    - assets/brands/
    - assets/catalog/
    - assets/fonts/
    - assets/textures/
  # B2-C/D — Alexandria is BUNDLED (SIL OFL 1.1) and registered here so the app
  # renders its intended typography offline, with no runtime GoogleFonts fetch.
  # ONE family, weight-mapped Regular→400 / Medium→500 / SemiBold→600 / Bold→700.
  # (IBM Plex Sans Arabic above stays asset-only — the PDF renderer loads its
  # bytes directly; it is deliberately NOT registered as a UI font family.)
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
    # BUNDLED Latin/Arabic fallback for the rare glyph Alexandria lacks —
    # replaces the old runtime `GoogleFonts.ibmPlexSans()` fallback (which failed
    # OFFLINE). Same TTFs the PDF renderer already ships; registering them as a
    # UI family here is additive (the PDF still loads their bytes directly).
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

  # json_serializable: ^6.8.0
  # mocktail: ^1.0.0
